# Google Vertex AI Provider Definition
id = "google_vertex"
name = "Google Vertex AI"
base_url = "https://{region}-aiplatform.googleapis.com"
doc = "https://cloud.google.com/vertex-ai/docs"

env = ["GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT"]

exclude_models = [
  "claude-3-5-sonnet@20241022",
]

# Runtime configuration schema
[[config_schema]]
name = "service_account_json"
type = "string"
required = false
doc = "Path to service account JSON file (can also use GOOGLE_APPLICATION_CREDENTIALS env var)"

[[config_schema]]
name = "project_id"
type = "string"
required = true
doc = "Google Cloud project ID (can also use GOOGLE_CLOUD_PROJECT env var)"

[[config_schema]]
name = "region"
type = "string"
required = false
default = "global"
doc = "Google Cloud region where Vertex AI is available (default 'global' for newest models)"

[extra]
auth_pattern = "service_account"
supports_anthropic_models = true
supports_gemini_models = true

[extra.experimental.modes.flex]
supported = true
models = [
  "gemini-3-flash-preview",
  "gemini-3-pro-image",
  "gemini-3.1-flash-image",
  "gemini-3.1-flash-lite",
  "gemini-3.1-flash-lite-image",
  "gemini-3.1-pro-preview",
  "gemini-3.5-flash",
  "gemini-3.5-flash-lite",
  "gemini-3.6-flash",
  "gemini-3.7-flash",
  "gemini-3.8-flash",
  "gemini-3.8-flash-cyber",
]
apis = ["generate_content", "stream_generate_content"]
source_url = "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/flex-paygo"
constraints = { region = "global", endpoint = "https://aiplatform.googleapis.com" }
provider = { headers = { "X-Vertex-AI-LLM-Request-Type" = "shared", "X-Vertex-AI-LLM-Shared-Request-Type" = "flex" } }
