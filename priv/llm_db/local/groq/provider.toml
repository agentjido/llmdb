# Groq Provider Definition
id = "groq"
name = "Groq"
base_url = "https://api.groq.com/openai/v1"
doc = "https://groq.com/docs"

env = ["GROQ_API_KEY"]

exclude_models = [
  "deepseek-r1-distill-llama-70b",
  "deepseek-r1-distill-llama-70b-specdec",
  "deepseek-r1-distill-qwen-32b",
  "distil-whisper-large-v3-en",
  "gemma-7b-it",
  "gemma2-9b-it",
  "llama-3.1-70b-specdec",
  "llama-3.1-70b-versatile",
  "llama-3.2-11b-text-preview",
  "llama-3.2-11b-vision-preview",
  "llama-3.2-1b-preview",
  "llama-3.2-3b-preview",
  "llama-3.2-90b-text-preview",
  "llama-3.2-90b-vision-preview",
  "llama-3.3-70b-specdec",
  "llama-guard-3-8b",
  "llama3-70b-8192",
  "llama3-8b-8192",
  "llama3-groq-70b-8192-tool-use-preview",
  "llama3-groq-8b-8192-tool-use-preview",
  "llava-v1.5-7b-4096-preview",
  "mistral-saba-24b",
  "mixtral-8x7b-32768",
  "moonshotai/kimi-k2-instruct",
  "qwen-2.5-32b",
  "qwen-2.5-coder-32b",
  "qwen-qwq-32b"
]

[runtime]
base_url = "https://api.groq.com/openai/v1"
doc_url = "https://groq.com/docs"

[runtime.auth]
type = "bearer"
env = ["GROQ_API_KEY"]

[runtime.execution]
text = "openai_chat_compatible"
object = "openai_chat_compatible"
embed = "openai_embeddings"
image = "openai_images"
transcription = "openai_transcription"

[extra.experimental.modes.flex]
supported = true
models = "all"
apis = ["chat_completions"]
source_url = "https://console.groq.com/docs/flex-processing"
constraints = { account = "paid" }
provider = { body = { service_tier = "flex" } }
