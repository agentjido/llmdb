id = "deepseek-v4-flash"

# Legacy summary uses off-peak rates; callers must select a pricing period.
# Reasoning is included in output, not an additional output charge.
[cost]
input = 0.15
output = 0.6
cache_read = 0.003
reasoning = 0.6

# Verified 2026-09-22 against current pricing and the corrected change log.
[pricing]
currency = "USD"
merge = "merge_by_id"
excluded_cost_components = ["token.reasoning"]

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 0.15
applies_when = { pricing_period = "off_peak" }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"
notes = "Charge cache-miss input only; prompt_cache_hit_tokens is billed separately."

[[pricing.components]]
id = "token.input.peak"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 0.3
applies_when = { pricing_period = "peak" }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"
notes = "Charge cache-miss input only; prompt_cache_hit_tokens is billed separately."

[[pricing.components]]
id = "token.output"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 0.6
applies_when = { pricing_period = "off_peak" }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"
notes = "Total completion tokens include reasoning tokens. Do not add reasoning_tokens a second time."

[[pricing.components]]
id = "token.output.peak"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 1.2
applies_when = { pricing_period = "peak" }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"
notes = "Total completion tokens include reasoning tokens. Do not add reasoning_tokens a second time."

[[pricing.components]]
id = "token.cache_read"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 0.003
applies_when = { pricing_period = "off_peak" }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_read.peak"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 0.006
applies_when = { pricing_period = "peak" }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[extra.pricing]
sources_checked_at = "2026-09-22"
source_urls = ["https://api-docs.deepseek.com/quick_start/pricing/", "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/", "https://api-docs.deepseek.com/updates/", "https://api-docs.deepseek.com/guides/kv_cache/", "https://api-docs.deepseek.com/api/create-chat-completion"]
price_basis = "off_peak"
canonical_model_id = "deepseek-flash"
served_model = "DeepSeek-V4.1-Flash"
output_includes_reasoning = true
long_context_premium = false
notes = "This callable compatibility ID routes to V4.1-Flash and uses Flash rates; the previous underlying model is retired."

[extra.pricing.period_schedule]
context_key = "pricing_period"
timezone = "UTC"
weekday_numbering = "iso8601"
peak_weekdays = [1, 2, 3, 4, 5]
peak_windows = [{ start = "01:00", end = "04:00" }, { start = "06:00", end = "10:00" }]
off_peak_weekdays = [6, 7]
other_hours_period = "off_peak"
holiday_region = "CN"
holiday_timezone = "Asia/Shanghai"
holiday_period = "off_peak"
holiday_calendar_status = "not_published"
billing_timestamp_status = "not_published"
instant_boundary_semantics = "not_published"
notes = "Callers supply pricing_period. The published schedule excludes Chinese public holidays and all weekends, including adjusted work weekends. The docs do not identify a billable timestamp or provide holiday dates; created is not documented as a tariff-selection timestamp."
