id = "deepseek-v4-pro"

# Legacy summary uses off-peak rates; callers must select a pricing period.
# Reasoning is included in output, not an additional output charge.
[cost]
input = 0.66
output = 1.98
cache_read = 0.022
reasoning = 1.98

# Verified 2026-09-22 against current pricing and the corrected change log.
