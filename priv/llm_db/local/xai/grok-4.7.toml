id = "grok-4.7"

# Rates and context bands come from the xAI model API; these modifiers are docs-only.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "pricing.priority"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "priority" }
excludes_when = { api = "batch" }
source = "provider_docs"
mode = "priority"
notes = "Use the response's confirmed service_tier for settled costs; requested priority can fall back to default."

[[pricing.components]]
id = "pricing.data_residency"
kind = "other"
unit = "other"
multiplier = 1.1
applies_to = ["token.*"]
applies_when = { base_url = "https://us.api.x.ai/v1" }
source = "provider_docs"
notes = "The US endpoint premium applies to input, cached input and output, including long-context rates."

[extra.pricing]
sources_checked_at = "2026-09-22"
source_urls = ["https://docs.x.ai/developers/advanced-api-usage/prompt-caching/usage-and-pricing", "https://api.x.ai/v1/models", "https://docs.x.ai/developers/pricing", "https://docs.x.ai/developers/models/grok-4.7"]
context_basis = "Total prompt tokens, including cached input; the long-context rate applies to the entire request at or above the threshold."
