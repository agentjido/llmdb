id = "qwen3.7-plus"

# Singapore International list rates; cost summarizes the first tier and explicit cache.
[cost]
input = 0.4
output = 1.6
cache_read = 0.04
cache_write = 0.5

# Verified 2026-09-22. K means 1,000; the full input selects every token rate.
# Cache-hit and cache-creation tokens count toward that input threshold.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 0.4
applies_when = { region = "singapore", deployment = "international", input_tokens = { lte = 256000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"
notes = "Tier uses total input including cached tokens. Apply this rate only to input tokens outside cache reads and explicit cache creation."

[[pricing.components]]
id = "token.input.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 1.2
applies_when = { region = "singapore", deployment = "international", input_tokens = { gt = 256000, lte = 1000000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"
notes = "Tier uses total input including cached tokens. Apply this rate only to input tokens outside cache reads and explicit cache creation."

[[pricing.components]]
