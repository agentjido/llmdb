# Official Albert model catalog and pricing checked 2026-10-30.
id = "bge-reranker-v2-m3"
name = "BGE Reranker v2 M3"
family = "bge"
doc_url = "https://guides.ia.numerique.gouv.fr/albert-api/modeles/available-models#bge-reranker-v2-m3"
aliases = ["BAAI/bge-reranker-v2-m3", "openweight-rerank"]
