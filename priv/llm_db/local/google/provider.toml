# Google Provider Definition
id = "google"
name = "Google"
base_url = "https://generativelanguage.googleapis.com/v1beta"
doc = "https://ai.google.dev/gemini-api/docs"

env = ["GOOGLE_API_KEY", "GEMINI_API_KEY"]

exclude_models = [
  "gemini-1.0-pro-001",
  "gemini-1.0-pro-002",
  "gemini-1.0-pro-vision-001",
  "gemini-1.5-flash",
  "gemini-1.5-flash-001",
  "gemini-1.5-flash-002",
  "gemini-1.5-flash-8b",
  "gemini-1.5-pro",
  "gemini-1.5-pro-001",
  "gemini-1.5-pro-002",
  "gemini-live-2.5-flash-preview-native-audio",
  "gemini-live-2.5-flash",
  "gemini-2.5-flash-preview-04-17",
  "gemini-2.5-pro-preview-05-06",
  "gemini-2.5-pro-preview-06-05",
  "gemini-2.5-flash-lite-preview-06-17",
  "gemini-2.5-flash-lite-preview-09-2025",
  "gemini-2.5-flash-preview-09-2025",
  "gemini-flash-lite-latest",
  "gemini-2.5-flash-image-preview",
  "gemini-2.5-flash-preview-tts",
  "gemini-2.5-pro-preview-tts",
  "gemini-3.1-flash-tts-preview",
  "embedding-001",
  "embedding-gecko-001",
  "gemini-embedding-exp-03-07",
  "gemini-embedding-exp",
]

[pricing_defaults]
currency = "USD"

[[pricing_defaults.components]]
id = "tool.web_search"
kind = "tool"
tool = "web_search"
unit = "call"
per = 1000
rate = 35.0

[runtime]
base_url = "https://generativelanguage.googleapis.com/v1beta"
doc_url = "https://ai.google.dev/docs"

[runtime.auth]
type = "header"
env = ["GOOGLE_API_KEY", "GEMINI_API_KEY"]
header_name = "x-goog-api-key"

[runtime.execution]
text = "google_generate_content"
object = "google_generate_content"

[extra.experimental.modes.flex]
supported = true
models = [
  "gemini-2.5-flash",
  "gemini-2.5-flash-lite",
  "gemini-2.5-pro",
  "gemini-3-flash-preview",
  "gemini-3.1-flash-lite",
  "gemini-3.1-pro-preview",
  "gemini-3.5-flash-lite",
  "gemini-3.6-flash",
  "gemini-3.8-flash",
  "gemini-4-argon",
  "gemini-4-carbon",
  "gemini-4-hydrogen",
  "gemini-4-neon",
]
apis = ["interactions"]
source_url = "https://aistudio.google.com/docs/flex-inference#supported-models"
provider = { body = { service_tier = "flex" } }
