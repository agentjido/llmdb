id = "claude-haiku-5-5"

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

# Verified 2026-10-09 against Anthropic pricing and prompt-caching docs.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 0.1
source = "provider_docs"

[[pricing.components]]
id = "token.output"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 0.5
source = "provider_docs"

[[pricing.components]]
id = "token.cache_read"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 0.01
source = "provider_docs"

[[pricing.components]]
id = "token.cache_write"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_write_tokens"
rate = 0.125
applies_when = { cache_ttl = "5m" }
source = "provider_docs"

[[pricing.components]]
id = "token.cache_write.1h"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_write_tokens"
derives_from = "token.input"
multiplier = 2.0
applies_when = { cache_ttl = "1h" }
notes = "Derive before applying token-wide modifiers; do not apply a modifier twice through the input dependency."
source = "provider_docs"

[[pricing.components]]
id = "pricing.batch"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { api = "batch" }
source = "provider_docs"
mode = "batch"

[[pricing.components]]
id = "pricing.data_residency"
kind = "other"
unit = "other"
multiplier = 1.1
applies_to = ["token.*"]
applies_when = { inference_geo = "us" }
source = "provider_docs"
notes = "US-only inference; global routing uses standard pricing. Cloud partner pricing is independent."

[[pricing.components]]
id = "pricing.long_context"
kind = "other"
unit = "other"
multiplier = 5.0
applies_to = ["token.*"]
applies_when = { input_tokens = { gt = 100000 } }
source = "provider_docs"
charge_scope = "full_request"
notes = "Prompt length includes uncached input, cache reads, and cache writes. Apply to the full request above 100000 input tokens."

[extra.pricing]
sources_checked_at = "2026-10-09"
source_urls = ["https://platform.claude.com/docs/en/about-claude/pricing", "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"]
long_context_premium = true
long_context_threshold = 100000
long_context_basis = "full_prompt_including_cache"
