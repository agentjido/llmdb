[[pricing.components]]
id = "token.cache_write.1h"
kind = "token"
unit = "token"
per = 1000000
rate = 20.0
applies_when = { cache_operation = "write", cache_ttl = "1h" }
source = "provider_docs"

[[pricing.components]]
id = "token.input.batch"
kind = "token"
unit = "token"
per = 1000000
rate = 5.0
