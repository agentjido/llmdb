disable_supported = false
raw_output_supported = false
summary_supported = true
encrypted_supported = true

[capabilities.tools]
enabled = true
streaming = true
strict = true
parallel = true
forced_choice = false

[capabilities.json]
schema = true
strict = true

[capabilities.streaming]
text = true
tool_calls = true

[capabilities.batch]
supported = true

[capabilities.citations]
supported = true

[capabilities.code_execution]
supported = true

[capabilities.context_management]
supported = true
features = ["clear_thinking", "clear_tool_uses", "compact"]

[lifecycle]
status = "active"

[extra]
availability = "general"
training_data_cutoff = "2026-06"
retirement_not_before = "2027-09-01"
