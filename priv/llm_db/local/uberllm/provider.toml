# UberLLM is not in models.dev. This adds the provider with its OpenAI chat
# runtime contract and a few starter models; prices come from GET /v1/models.
# https://uberllm.dev/docs/quickstart
id = "uberllm"
name = "UberLLM"
base_url = "https://api.uberllm.dev/v1"
doc = "https://uberllm.dev/docs/quickstart"
env = ["UBERLLM_API_KEY"]

[runtime]
base_url = "https://api.uberllm.dev/v1"
doc_url = "https://uberllm.dev/docs/quickstart"

[runtime.auth]
type = "bearer"
env = ["UBERLLM_API_KEY"]

[runtime.execution]
text = "openai_chat_compatible"
object = "openai_chat_compatible"
