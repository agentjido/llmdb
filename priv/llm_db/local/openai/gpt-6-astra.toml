id = "gpt-6-astra"
provider_model_id = "gpt-6-astra"
name = "GPT-6 Astra"
family = "gpt-6"
release_date = "2026-09-03"
last_updated = "2026-09-03"
knowledge = "2026-04-30"
doc_url = "https://developers.openai.com/api/docs/models/gpt-6-astra"
aliases = []

[limits]
context = 1050000
input = 922000
output = 128000

# Standard rates for requests with at most 272K input tokens.
[cost]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.5

# Verified 2026-09-22 against the model page and pricing page below.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 10.0
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.input.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 20.0
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.output"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 50.0
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.output.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 75.0
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_read"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 1.0
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_read.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 2.0
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_write"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_write_tokens"
rate = 12.5
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_write.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_write_tokens"
rate = 25.0
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

# Apply one processing modifier to the selected context tier, then residency.

[[pricing.components]]
id = "pricing.batch"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { api = "batch" }
source = "provider_docs"
mode = "batch"

[[pricing.components]]
id = "pricing.flex"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { service_tier = "flex" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "flex"

[[pricing.components]]
id = "pricing.fast"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "fast" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "fast"

[[pricing.components]]
id = "pricing.priority"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "priority" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "priority"

[[pricing.components]]
id = "pricing.ultrafast"
kind = "other"
unit = "other"
multiplier = 6.0
applies_to = ["token.*"]
applies_when = { service_tier = "ultrafast" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "ultrafast"

[[pricing.components]]
id = "pricing.data_residency"
kind = "other"
unit = "other"
multiplier = 1.1
applies_to = ["token.*"]
applies_when = { regional_processing = true }
source = "provider_docs"
notes = "Regional processing endpoint uplift. Eligibility is separate from pricing; see extra.pricing."

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities.reasoning]
enabled = true

[capabilities.reasoning.effort]
supported = true
values = ["low", "medium", "high", "xhigh", "max"]

[capabilities.tools]
enabled = true

[capabilities.json]
schema = true
strict = true

[capabilities.streaming]
text = true

[capabilities.batch]
supported = true

[capabilities.code_execution]
supported = true

[capabilities.context_management]
supported = true
features = ["compact"]

[lifecycle]
status = "active"

[extra]
availability = "general"
availability_updated = "2026-09-29"
availability_note = "Ultrafast mode is available to all API users at low rate limits."
description = "Model for complex reasoning, coding, computer use, research, and document creation."
temperature = false
tool_calling_endpoint = "/v1/responses"
supported_endpoints = ["/v1/responses", "/v1/chat/completions", "/v1/batch"]
source_urls = [
  "https://developers.openai.com/api/docs/models/gpt-6-astra",
  "https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6-astra",
  "https://developers.openai.com/api/docs/pricing",
  "https://developers.openai.com/api/docs/guides/ultrafast-mode"
]

[extra.wire]
protocol = "openai_responses"

# Legacy mode multipliers retained for compatibility; canonical modifiers are above.
[extra.pricing]
sources_checked_at = "2026-09-29"
source_urls = ["https://developers.openai.com/api/docs/models/gpt-6-astra", "https://developers.openai.com/api/docs/pricing"]
mode_multipliers = { batch = 0.5, flex = 0.5, fast = 2.0, priority = 2.0, ultrafast = 6.0 }
mode_multiplier_scope = "Apply to the selected Standard token rates, for both short and long context."
fast_mode_unavailable_data_residency = ["eu"]

ultrafast_data_residency_processing = ["us"]
ultrafast_global_processing = true
