id = "gpt-6-luna"

# Standard short-context rates; conditional rates are in pricing.components.
[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[capabilities.reasoning.effort]
supported = true
values = ["none", "low", "medium", "high", "xhigh", "max"]
default = "medium"

# Verified 2026-09-22 against the model page and pricing page below.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 0.1
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.input.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 0.2
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.output"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 0.5
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.output.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "output_tokens"
rate = 0.75
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_read"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 0.01
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_read.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "cache_read_tokens"
rate = 0.02
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.cache_write"
kind = "token"
unit = "token"
