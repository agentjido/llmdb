# Apply one processing modifier to the selected context tier, then residency.
[[pricing.components]]
id = "pricing.batch"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { api = "batch" }
source = "provider_docs"
mode = "batch"

[[pricing.components]]
id = "pricing.flex"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { service_tier = "flex" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "flex"

[[pricing.components]]
id = "pricing.fast"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "fast" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "fast"

[[pricing.components]]
id = "pricing.priority"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "priority" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "priority"

[[pricing.components]]
id = "pricing.data_residency"
kind = "other"
unit = "other"
multiplier = 1.1
applies_to = ["token.*"]
applies_when = { regional_processing = true }
source = "provider_docs"
notes = "Regional processing endpoint uplift."

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities.reasoning]
enabled = true

[capabilities.reasoning.effort]
supported = true
values = ["none", "low", "medium", "high", "xhigh", "max"]
default = "medium"

[capabilities.tools]
enabled = true

[capabilities.json]
schema = true
strict = true

[capabilities.streaming]
text = true

[capabilities.batch]
supported = true

[capabilities.code_execution]
supported = true

[capabilities.context_management]
supported = true
features = ["compact"]

[lifecycle]
status = "active"

[extra]
description = "A fast, efficient model for visual reasoning, precise computer use, and clear, natural writing."
tool_calling_endpoint = "/v1/responses"
supported_endpoints = ["/v1/responses", "/v1/chat/completions", "/v1/batch"]
