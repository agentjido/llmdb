[limits]
context = 1050000
input = 922000
output = 128000

# Standard rates for requests with at most 272K input tokens.
[cost]
input = 1.0
output = 5.0
cache_read = 0.05
cache_write = 1.25

# Verified 2026-10-29 against the model page and pricing page below.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 1.0
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
