id = "gpt-5.6"

# Standard short-context rates; conditional rates are in pricing.components.
[cost]
input = 4.0
output = 20.0
cache_read = 0.4
cache_write = 5.0

# Verified 2026-09-22 against the model page and pricing page below.
[pricing]
currency = "USD"
merge = "merge_by_id"

[[pricing.components]]
id = "token.input"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 4.0
applies_when = { input_tokens = { lte = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
id = "token.input.long_context"
kind = "token"
unit = "token"
per = 1000000
meter = "input_tokens"
rate = 8.0
applies_when = { input_tokens = { gt = 272000 } }
mode = "standard"
charge_scope = "full_request"
source = "provider_docs"

[[pricing.components]]
