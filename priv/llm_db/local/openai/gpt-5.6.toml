# Apply one processing modifier to the selected context tier, then residency.

[[pricing.components]]
id = "pricing.batch"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { api = "batch" }
source = "provider_docs"
mode = "batch"

[[pricing.components]]
id = "pricing.flex"
kind = "other"
unit = "other"
multiplier = 0.5
applies_to = ["token.*"]
applies_when = { service_tier = "flex" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "flex"

[[pricing.components]]
id = "pricing.fast"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "fast" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "fast"

[[pricing.components]]
id = "pricing.priority"
kind = "other"
unit = "other"
multiplier = 2.0
applies_to = ["token.*"]
applies_when = { service_tier = "priority" }
source = "provider_docs"
excludes_when = { api = "batch" }
mode = "priority"

[[pricing.components]]
id = "pricing.data_residency"
kind = "other"
unit = "other"
multiplier = 1.1
applies_to = ["token.*"]
applies_when = { regional_processing = true }
source = "provider_docs"
notes = "Regional processing endpoint uplift. Eligibility is separate from pricing; see extra.pricing."

[extra.pricing]
sources_checked_at = "2026-09-22"
source_urls = ["https://developers.openai.com/api/docs/models/gpt-5.6", "https://developers.openai.com/api/docs/pricing", "https://developers.openai.com/zh-Hans/api/docs/pricing", "https://developers.openai.com/api/docs/guides/fast-mode", "https://developers.openai.com/api/docs/guides/prompt-caching"]
context_tier_basis = "Total input tokens, including cache reads and writes. The selected tier prices the entire request, including output."
promotion = "Current Sol promotional rates are available at least through 2026-11-21; this is not a confirmed expiry date."
alias_note = "gpt-5.6 currently routes to gpt-5.6-sol; verify the resolved model when estimating prices."
