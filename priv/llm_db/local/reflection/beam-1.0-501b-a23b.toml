id = "Beam-1.0-501B-A23B"
provider_model_id = "Beam-1.0-501B-A23B"
name = "Beam 1.0 501B A23B"
family = "beam"
release_date = "2026-10-05"
knowledge = "2026-06-30"

[limits]
context = 262144
output = 131072

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
chat = true
embeddings = false

[capabilities.reasoning]
enabled = true

[capabilities.reasoning.effort]
supported = true
values = ["low", "medium", "high", "xhigh", "max"]

[capabilities.tools]
enabled = true
strict = true
parallel = true
streaming = true

[capabilities.json]
native = true
schema = true
strict = true

[capabilities.streaming]
text = true
tool_calls = true

[extra]
availability = "beta"
interleaved = { field = "reasoning_content" }
source_urls = ["https://developers.reflection.ai/models", "https://developers.reflection.ai/reasoning", "https://developers.reflection.ai/openai-compatibility", "https://developers.reflection.ai/tool-calling", "https://developers.reflection.ai/structured-outputs", "https://developers.reflection.ai/streaming"]
notes = "The beta API context limit can change. Every assistant message in a request requires non-empty reasoning_content."

[extra.reasoning]
mandatory = true
default_effort_scope = "organization"

[extra.wire]
protocol = "openai_chat"

[extra.constraints]
token_limit_key = "max_completion_tokens"
reasoning_effort = "supported"
