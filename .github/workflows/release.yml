name: Release to Hex and NPM

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate packages without a commit, tag, or publish)"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip tests before release"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - publish_release

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the main branch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run releases only from the main branch."
            exit 1
          fi

      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      - name: Fetch tags
        run: |
          git fetch --tags --force
          echo "Available tags:"
          git tag -l | tail -10

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use the pinned NPM version
        run: npm install --global npm@11.19.0

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-elixir-1.18-otp-27-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-elixir-1.18-otp-27-

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix deps.get
          MIX_ENV=dev mix deps.compile git_ops
          npm ci

      - name: Validate committed snapshot
        run: |
          set -euo pipefail
          mix llm_db.build --check --install

      - name: Run tests
        if: ${{ inputs.skip_tests != true }}
        run: |
          set -euo pipefail
          mix test

      - name: Run quality checks
        run: |
          set -euo pipefail
          mix quality

      - name: Run NPM package checks
        run: |
          set -euo pipefail
          npm run npm:check

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump and synchronize package versions
        id: version
        run: |
          set -euo pipefail
          mix llm_db.version
          npm run npm:sync
          VERSION=$(grep -oP '@version "\K[^"]+' mix.exs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Prepared version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet -- mix.exs packages/llmdb/package.json package-lock.json; then
            echo "Version already up to date"
          else
            git add mix.exs packages/llmdb/package.json package-lock.json
            git commit -m "chore: bump version to $VERSION"
          fi

      - name: Validate release packages
        run: |
          set -euo pipefail
          mix hex.build --output "$RUNNER_TEMP/llm_db-${{ steps.version.outputs.version }}.tar"
          npm publish --workspace @agentjido/llmdb --access public --dry-run

      - name: Generate changelog and create tag
        if: ${{ inputs.dry_run != true }}
        env:
          MIX_ENV: dev
        run: |
          set -euo pipefail
          mix git_ops.release --yes --override "${{ steps.version.outputs.version }}"

      - name: Push changes and tags
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git push origin main
          git push --tags

      - name: Dispatch publishing from the release commit
        if: ${{ inputs.dry_run != true }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-list -n 1 "$RELEASE_VERSION")

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg release_sha "$RELEASE_SHA" \
            '{event_type: "publish_release", client_payload: {version: $version, release_sha: $release_sha}}' \
            > "$RUNNER_TEMP/release-dispatch.json"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/release-dispatch.json"

          echo "### Dispatched registry publishing for $RELEASE_VERSION at $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish_context:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'publish_release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.release_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release dispatch
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_SHA: ${{ github.event.client_payload.release_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release commit: $RELEASE_SHA"
            exit 1
          fi

          TAG_SHA=$(git rev-list -n 1 "$RELEASE_VERSION")
          MIX_VERSION=$(grep -oP '@version "\K[^"]+' mix.exs)
          NPM_VERSION=$(jq -r '.version' packages/llmdb/package.json)

          if [[ "$GITHUB_SHA" != "$RELEASE_SHA" || "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::The publish run, release tag, and dispatched commit must match."
            echo "Run: $GITHUB_SHA; tag: $TAG_SHA; dispatch: $RELEASE_SHA"
            exit 1
          fi

          if [[ "$MIX_VERSION" != "$RELEASE_VERSION" || "$NPM_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::The release tag, Hex version, and NPM version must match."
            echo "Tag: $RELEASE_VERSION; Hex: $MIX_VERSION; NPM: $NPM_VERSION"
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "### Verified release $RELEASE_VERSION at $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish_hex:
    needs: publish_context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish_context.outputs.version }}
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Install dependencies
        run: mix deps.get

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ needs.publish_context.outputs.version }}
        run: |
          set -euo pipefail
          MIX_VERSION=$(grep -oP '@version "\K[^"]+' mix.exs)
          if [[ "$MIX_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Hex version $MIX_VERSION does not match tag $RELEASE_VERSION."
            exit 1
          fi
          mix llm_db.build --check --install

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail
          mix hex.publish --yes
          echo "### Published llm_db ${{ needs.publish_context.outputs.version }} to Hex.pm" >> "$GITHUB_STEP_SUMMARY"

  publish_npm:
    needs:
      - publish_context
      - publish_hex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish_context.outputs.version }}
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use the pinned NPM version
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix deps.get
          npm ci

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ needs.publish_context.outputs.version }}
        run: |
          set -euo pipefail
          MIX_VERSION=$(grep -oP '@version "\K[^"]+' mix.exs)
          NPM_VERSION=$(node -p "require('./packages/llmdb/package.json').version")
          if [[ "$MIX_VERSION" != "$RELEASE_VERSION" || "$NPM_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Tag, Hex, and NPM versions must match."
            echo "Tag: $RELEASE_VERSION; Hex: $MIX_VERSION; NPM: $NPM_VERSION"
            exit 1
          fi

      - name: Check NPM package
        run: npm run npm:check

      - name: Publish to NPM with trusted publishing
        run: |
          set -euo pipefail
          npm publish --workspace @agentjido/llmdb --access public
          echo "### Published @agentjido/llmdb ${{ needs.publish_context.outputs.version }} to NPM" >> "$GITHUB_STEP_SUMMARY"

  github_release:
    needs:
      - publish_context
      - publish_hex
      - publish_npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Create GitHub release
        env:
          RELEASE_VERSION: ${{ needs.publish_context.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release v$RELEASE_VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/CHANGELOG.md) for details."
